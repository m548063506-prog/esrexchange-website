<!-- GitHub Pages Contact Form - replacement version
Use this only if you want to replace the whole old form.
It does NOT use mailto and it does NOT open the visitor's email app.
-->

<form id="contactForm" class="contact-form">
  <input type="text" name="name" placeholder="Your Name" required>
  <input type="email" name="email" placeholder="Your Email" required>
  <input type="tel" name="phone" placeholder="Phone Number">
  <input type="text" name="company" placeholder="Company Name">
  <textarea name="message" placeholder="Tell us what you have available or what you are looking for" rows="5"></textarea>
  <button type="submit">Submit</button>
</form>

<script src="contact-fix.js"></script>
