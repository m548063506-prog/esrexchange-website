  <text x="150" y="63" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#102326" letter-spacing="1">ESR</text>
  <text x="150" y="112" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" fill="#0b5d56">Exchange</text>
