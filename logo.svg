    <path d="M38 71h24l16-17h25" fill="none" stroke="#10a68e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 87h30l16-18h29" fill="none" stroke="#0b5d56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="71" r="7" fill="#fff" stroke="#10a68e" stroke-width="5"/>
    <circle cx="83" cy="87" r="7" fill="#fff" stroke="#0b5d56" stroke-width="5"/>
    <circle cx="104" cy="54" r="7" fill="#fff" stroke="#7cc84a" stroke-width="5"/>
