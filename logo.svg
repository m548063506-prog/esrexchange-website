<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" role="img" aria-labelledby="title desc">
  <title id="title">ESR Exchange Logo</title>
  <desc id="desc">Circular exchange arrows with ESR Exchange wordmark.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5d56"/>
      <stop offset="0.5" stop-color="#10a68e"/>
      <stop offset="1" stop-color="#7cc84a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b5d56" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="70" cy="70" r="52" fill="none" stroke="url(#g)" stroke-width="12"/>
    <path d="M41 45c15-17 42-23 65-10" fill="none" stroke="#0b5d56" stroke-width="13" stroke-linecap="round"/>
    <path d="M103 25l24 7-15 21z" fill="#0b5d56"/>
